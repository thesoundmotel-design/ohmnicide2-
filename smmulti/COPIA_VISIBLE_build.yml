name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build --config Release --target SoundMotelMultidrive_VST3 --parallel
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\SoundMotelMultidrive.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SoundMotelMultidrive-Windows-Installer
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build VST3 + AU
        run: cmake --build build --config Release --target SoundMotelMultidrive_VST3 SoundMotelMultidrive_AU --parallel
      - name: Build installer
        run: bash installer/mac/build_pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SoundMotelMultidrive-macOS-Installer
          path: dist/*.pkg
